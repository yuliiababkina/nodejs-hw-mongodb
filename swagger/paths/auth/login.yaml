tags:
  - Auth
summary: Log in an user
operationId: loginUser
description: 'Login an user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'johnd@gmail.com'
          password:
            description: "User's password"
            type: string
            example: '123456'
responses:
  '200':
    description: Log in an user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'wsSxBHkNIBDxsjkSznCLAXHWDwgEMdTeVYWbLXln'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
