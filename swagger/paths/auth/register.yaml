tags:
  - Auth
summary: User registration
operationId: registerUser
description: 'Register an user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'johnd@gmail.com'
          password:
            description: "User's password"
            type: string
            example: '123456'
responses:
  '201':
    description: 'Register an user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              type: object
              $ref: '../../components/schemas/user.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '409':
    $ref: ../../components/responses/409.yaml
