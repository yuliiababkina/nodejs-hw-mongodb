tags:
  - Auth
summary: Reset user's password
operationId: resetPassword
description: "Reset user's password"
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            description: "New user's password"
            type: string
            example: '123qwery'
          token:
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2N2U3NDAyMWUyNDAwMzgzZGMxNWMxNWYiLCJlbWFpbCI6Inl1bGljaGthLmJhYmtpbmExMzEyQGdtYWlsLmNvbSIsImlhdCI6MTc0MzIwODU2MywiZXhwIjoxNzQzMjA4ODYzfQ.sV3rCQDr3ZqPe4Gq3PnAmQO9P2qPA1mxNDJKmjCcym8'
responses:
  '200':
    description: "Reset user's password"
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'A password has been successfully reset!'
            data: {}
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
